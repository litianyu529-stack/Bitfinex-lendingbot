[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".state"]

[tool.ruff.lint]
select = ["E", "F"]

[tool.ruff.lint.per-file-ignores]
"mika_v4/store.py" = ["E501"]
"mika_v4/migration.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["mika_v4"]

[tool.coverage.report]
show_missing = true
fail_under = 85
